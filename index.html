<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED 전광판</title>
  <style>
    @font-face {
      font-family: 'Mulmaru';
      src: url('fonts/Mulmaru.woff2') format('woff2'),
           url('fonts/Mulmaru.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #171717;
      --text: #e5e5e5;
      --text-muted: #737373;
      --led-color: #c77dff;
      --led-glow: rgba(199, 125, 255, 0.85);
      --chroma-color: #00b140;
      --dot-size: 7px;
      --panel-w: 900px;
      --panel-h: 130px;
      --scroll-duration: 12s;
    }

    html.chroma-key,
    body.chroma-key {
      background: var(--chroma-color) !important;
    }

    body.chroma-key {
      padding: 0;
    }

    body.chroma-key .layout > .snb { display: none; }

    body.chroma-key .main {
      margin-left: 0;
      padding: 0;
    }

    body.chroma-key .page-wrap {
      padding: 0;
      min-height: auto;
      justify-content: flex-start;
      align-items: flex-start;
    }

    body.chroma-key .led-frame {
      box-shadow: 0 0 0 2px #1a1010;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Mulmaru', "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    html.obs,
    html.obs body,
    body.obs {
      width: max-content !important;
      height: max-content !important;
      min-height: 0 !important;
      min-width: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
    }

    body.obs .layout,
    body.obs .main,
    body.obs .page-wrap {
      display: block !important;
      width: max-content !important;
      height: max-content !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    

    body.obs .page-wrap {
      justify-content: flex-start;
      align-items: flex-start;
    }

    body.obs .signboard-stack {
      width: var(--panel-w);
      max-width: none;
      gap: 0;
    }

    body.obs .signboard-stack .led-frame + .led-frame {
      margin-top: 20px;
    }

    body.obs .admin-only,
    body.obs .hint { display: none !important; }

    .page-title {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: normal;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
      width: 100%;
      max-width: var(--panel-w);
      text-align: left;
    }

    .page-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .hint {
      font-size: 0.85rem;
      color: #737373;
      text-align: center;
      line-height: 1.6;
      max-width: 640px;
    }

    .hint code {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.06);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .signboard-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: var(--panel-w);
      max-width: 100%;
    }

    .led-frame {
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 0 2px #1a1010, 0 8px 32px rgba(0, 0, 0, 0.55);
    }

    .led-viewport {
      position: relative;
      width: 100%;
      height: var(--panel-h);
      overflow: hidden;
      background-color: #0a0606;
      background-image: radial-gradient(circle, #2a1818 1.2px, transparent 1.2px);
      background-size: var(--dot-size) var(--dot-size);
    }

    .led-viewport::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.35));
      pointer-events: none;
      z-index: 2;
    }

    .led-track {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      z-index: 1;
    }

    .led-track.centered {
      left: 50%;
      transform: translateX(-50%);
    }

    .led-track.scrolling {
      animation-name: led-marquee;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .led-text {
      display: inline-block;
    }

    .led-text.gap { padding-right: 3rem; }

    .led-text-inner {
      display: inline-block;
      padding: 0 0.6em;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.06em;
    }

    .led-char {
      color: transparent;
      background-color: var(--led-char-color);
      background-image: radial-gradient(circle at center, var(--led-char-color) 38%, transparent 40%);
      background-size: var(--dot-size) var(--dot-size);
      -webkit-background-clip: text;
      background-clip: text;
      filter:
        drop-shadow(0 0 2px var(--led-char-glow))
        drop-shadow(0 0 8px var(--led-char-glow))
        drop-shadow(0 0 18px var(--led-char-glow));
    }

    .led-char--space {
      min-width: 0.38em;
    }

    @keyframes led-marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .led-viewport.led-wavy .led-char {
      display: inline-block;
      transform-origin: center bottom;
      animation: led-wave 2.4s ease-in-out infinite;
      animation-delay: calc(var(--wave-i, 0) * -0.11s);
    }

    @keyframes led-wave {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(calc(var(--wave-amp, 10px) * -1)) rotate(-5deg); }
      75% { transform: translateY(var(--wave-amp, 10px)) rotate(5deg); }
    }

    .led-viewport.led-blink .led-char {
      animation: led-blink 0.9s ease-in-out infinite, led-wave 2.4s ease-in-out infinite;
      animation-delay: 0s, calc(var(--wave-i, 0) * -0.11s);
    }

    .led-viewport.led-blink:not(.led-wavy) .led-char {
      animation: led-blink 0.9s ease-in-out infinite;
    }

    @keyframes led-blink {
      0%, 100% {
        opacity: 1;
        filter:
          drop-shadow(0 0 2px var(--led-char-glow))
          drop-shadow(0 0 8px var(--led-char-glow))
          drop-shadow(0 0 18px var(--led-char-glow));
      }
      50% {
        opacity: 0.18;
        filter:
          drop-shadow(0 0 1px var(--led-char-glow))
          drop-shadow(0 0 3px var(--led-char-glow));
      }
    }

    .toggle-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0.85rem;
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }

    .toggle-field label {
      margin: 0;
      font-size: 0.88rem;
      color: #e5e5e5;
    }

    .btn-toggle {
      min-width: 64px;
      padding: 0.45rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #a3a3a3;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-toggle.active {
      background: linear-gradient(135deg, #c77dff, #9333ea);
      color: #fff;
      border-color: rgba(233, 213, 255, 0.5);
    }

    .stack-controls {
      display: flex;
      gap: 0.5rem;
      width: var(--panel-w);
      max-width: 100%;
      justify-content: flex-end;
    }

    .btn-stack {
      width: 40px;
      height: 40px;
      padding: 0;
      font-size: 1.25rem;
      line-height: 1;
      font-weight: 700;
      border-radius: 8px;
    }

    .btn-stack:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .admin-panel {
      width: min(640px, 100%);
      background: #171717;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.25rem 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .boards-editor {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .board-editor-row {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.75rem;
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }

    .board-editor-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .board-editor-num {
      font-size: 0.75rem;
      color: #737373;
      flex-shrink: 0;
      min-width: 1.5rem;
    }

    .board-editor-head input {
      flex: 1;
      padding: 0.55rem 0.75rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: #e5e5e5;
      background: #171717;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      outline: none;
    }

    .board-editor-head input:focus {
      border-color: rgba(199, 125, 255, 0.5);
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: #a3a3a3;
      margin-bottom: 0.4rem;
    }

    .field input[type="number"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-size: 1rem;
      font-family: inherit;
      color: #e5e5e5;
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      outline: none;
    }

    .row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .row .field { flex: 1; min-width: 120px; }

    .color-presets {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-btn:hover { transform: scale(1.08); }
    .color-btn.active { border-color: #fff; }
    .color-btn.light-swatch { border-color: rgba(255, 255, 255, 0.28); }

    .color-btn-rainbow {
      width: auto;
      min-width: 32px;
      height: 32px;
      padding: 0 10px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, #ff4444, #ff8800, #ffdd00, #44ff44, #4488ff, #4466ff, #aa44ff, #ff44cc);
      font-family: inherit;
    }

    input[type="color"] {
      width: 100%;
      height: 36px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: #0a0a0a;
      cursor: pointer;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--led-color);
    }

    .range-val {
      font-size: 0.8rem;
      color: #737373;
      text-align: right;
      margin-top: 0.25rem;
    }

    .btn {
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.88; }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e5e5;
    }

    .btn-obs-copy {
      flex-shrink: 0;
      padding: 0.5rem 0.75rem;
      font-size: 0.78rem;
      white-space: nowrap;
      background: rgba(125, 211, 252, 0.12);
      color: #7dd3fc;
      border: 1px solid rgba(125, 211, 252, 0.28);
    }

    .btn-obs-copy:hover { background: rgba(125, 211, 252, 0.22); }

    .btn-obs-copy.copied {
      background: rgba(74, 222, 128, 0.18);
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.35);
    }

  
    .main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
      overflow: auto;
    }
    body.chroma-key .main { margin-left: 0; padding: 0; }
    @media (max-width: 768px) {
      .main { padding: 1.25rem 1rem 2rem; }
    }
    .layout { display: flex; min-height: 100vh; width: 100%; }
    .main { flex: 1; margin-left: 0; min-width: 0; }
  </style>
</head>
<body>
  <div class="layout">
    <main class="main">
      <div class="page-wrap">
        <h1 class="page-title admin-only">LED 전광판</h1>

        <div class="signboard-stack" id="signboard_stack"></div>

        <div class="stack-controls admin-only">
          <button type="button" class="btn btn-secondary btn-stack" id="remove_board_btn" title="전광판 제거" disabled>−</button>
          <button type="button" class="btn btn-secondary btn-stack" id="add_board_btn" title="전광판 추가">+</button>
        </div>

        <div class="admin-panel admin-only">
          <label class="field" style="margin-bottom:-0.25rem;">
            <span style="font-size:0.8rem;color:#a3a3a3;">전광판 목록</span>
          </label>
          <div class="boards-editor" id="boards_editor"></div>

          <div class="toggle-field">
            <label for="blink_toggle">깜빡임 효과</label>
            <button type="button" class="btn btn-toggle" id="blink_toggle" aria-pressed="false">OFF</button>
          </div>

          <div class="toggle-field">
            <label for="wavy_toggle">구불구불 효과</label>
            <button type="button" class="btn btn-toggle" id="wavy_toggle" aria-pressed="false">OFF</button>
          </div>

          <div class="row">
            <div class="field">
              <label for="speed_range">스크롤 속도</label>
              <input type="range" id="speed_range" min="4" max="60" value="12" step="1">
              <div class="range-val" id="speed_label">보통 · 가로 900px 기준 12초</div>
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="width_input">가로 (px)</label>
              <input type="number" id="width_input" min="200" max="1920" value="900" step="10">
            </div>
            <div class="field">
              <label for="height_input">세로 (px)</label>
              <input type="number" id="height_input" min="60" max="400" value="130" step="5">
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    (function () {
      var STORAGE_KEY = "bangsong_signboard_v2";
      var CHROMA_STORAGE_KEY = "bangsong_roulette_chroma_v1";
      var RAINBOW_COLORS = [
        "#ff4444", "#ff8800", "#ffdd00", "#44ff44",
        "#4488ff", "#4466ff", "#aa44ff", "#ff44cc"
      ];

      var isObs = /(?:^|[?&])obs=1(?:&|$)/.test(location.search);
      var params = new URLSearchParams(location.search);
      var chromaState = { enabled: false, color: "#00b140" };

      var defaultBoard = function () {
        return { text: "", color: "#c77dff", rainbow: false };
      };

      var defaults = {
        speed: 12,
        width: 900,
        height: 130,
        blink: false,
        wavy: false,
        boards: [defaultBoard()]
      };

      var state = loadState();
      applyUrlParams();

      var els = {
        body: document.body,
        stack: document.getElementById("signboard_stack"),
        editor: document.getElementById("boards_editor"),
        addBtn: document.getElementById("add_board_btn"),
        removeBtn: document.getElementById("remove_board_btn"),
        speedRange: document.getElementById("speed_range"),
        speedLabel: document.getElementById("speed_label"),
        widthInput: document.getElementById("width_input"),
        heightInput: document.getElementById("height_input"),
        blinkToggle: document.getElementById("blink_toggle"),
        wavyToggle: document.getElementById("wavy_toggle")
      };

      if (isObs) {
        els.body.classList.add("obs");
        document.documentElement.classList.add("obs");
      }

      if (!params.has("chroma") && !params.get("chromaColor")) {
        loadChromaState();
      } else {
        saveChromaState();
      }
      applyChromaState();

      bindUI();
      renderAll();

      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.boards && parsed.boards.length) {
              return normalizeState(parsed);
            }
          }
          var legacy = localStorage.getItem("rabbibot_signboard_v1") || localStorage.getItem("rabbibot_signboard_v2");
          if (legacy) {
            var old = JSON.parse(legacy);
            return normalizeState({
              speed: old.speed,
              width: old.width,
              height: old.height,
              boards: [{ text: old.text || "", color: old.color || "#c77dff", rainbow: false }]
            });
          }
        } catch (e) { /* ignore */ }
        return normalizeState(defaults);
      }

      function normalizeState(s) {
        var boards = (s.boards || [defaultBoard()]).map(function (b) {
          return {
            text: b.text != null ? String(b.text) : "",
            color: b.color || "#c77dff",
            rainbow: !!b.rainbow
          };
        });
        if (!boards.length) boards = [defaultBoard()];
        return {
          speed: clampNum(+s.speed, 4, 60) || defaults.speed,
          width: clampNum(+s.width, 200, 1920) || defaults.width,
          height: clampNum(+s.height, 60, 400) || defaults.height,
          blink: !!s.blink,
          wavy: !!s.wavy,
          boards: boards
        };
      }

      function applyUrlParams() {
        if (params.has("lines")) {
          var texts = params.get("lines").split("|");
          var colorStr = params.get("boardColors") || "";
          var colors = colorStr ? colorStr.split("|") : [];
          state.boards = texts.map(function (t, i) {
            var c = colors[i] || colors[0] || "#c77dff";
            if (c === "rainbow") return { text: t, color: "#c77dff", rainbow: true };
            return { text: t, color: decodeColorParam(c), rainbow: false };
          });
        } else if (params.has("text")) {
          state.boards[0].text = params.get("text");
          if (params.get("color")) {
            var cp = decodeColorParam(params.get("color"));
            if (cp === "rainbow") {
              state.boards[0].rainbow = true;
            } else {
              state.boards[0].color = cp;
              state.boards[0].rainbow = false;
            }
          }
        }
        if (params.get("speed")) state.speed = clampNum(+params.get("speed"), 4, 60) || state.speed;
        if (params.get("w")) state.width = clampNum(+params.get("w"), 200, 1920) || state.width;
        if (params.get("h")) state.height = clampNum(+params.get("h"), 60, 400) || state.height;
        if (params.has("blink")) state.blink = params.get("blink") !== "0";
        if (params.has("wavy")) state.wavy = params.get("wavy") !== "0";
        if (params.has("chroma")) chromaState.enabled = params.get("chroma") !== "0";
        if (params.get("chromaColor")) chromaState.color = decodeColorParam(params.get("chromaColor"));
      }

      function saveState() {
        if (isObs) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) { /* ignore */ }
      }

      function decodeColorParam(v) {
        if (!v) return "#c77dff";
        if (v === "rainbow") return "rainbow";
        if (v.charAt(0) === "#") return v;
        try { return decodeURIComponent(v); } catch (e) { return v; }
      }

      function clampNum(n, min, max) {
        if (!isFinite(n)) return null;
        return Math.min(max, Math.max(min, n));
      }

      function hexToGlow(hex) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        return "rgba(" + r + "," + g + "," + b + ",0.85)";
      }

      var GREEN_CHROMA_ALT = {
        "#44ff44": "#ffdd00",
        "#4ade80": "#fbbf24",
        "#00ff00": "#ff8800",
        default: "#ffdd00"
      };

      function parseHexRgb(hex) {
        var h = String(hex || "").replace("#", "");
        if (h.length === 3) {
          h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        }
        if (h.length !== 6) return null;
        return {
          r: parseInt(h.slice(0, 2), 16),
          g: parseInt(h.slice(2, 4), 16),
          b: parseInt(h.slice(4, 6), 16)
        };
      }

      function isGreenChromaActive() {
        return chromaState.enabled && chromaState.color.toLowerCase() === "#00b140";
      }

      function isGreenishLedColor(hex) {
        var c = parseHexRgb(hex);
        if (!c) return false;
        var max = Math.max(c.r, c.g, c.b);
        if (max < 40) return false;
        if (c.g >= c.r * 1.15 && c.g >= c.b * 1.15 && c.g >= 70) return true;
        var dr = c.r - 0;
        var dg = c.g - 177;
        var db = c.b - 64;
        return Math.sqrt(dr * dr + dg * dg + db * db) < 110;
      }

      function replaceGreenForChroma(hex) {
        var key = String(hex || "").toLowerCase();
        return GREEN_CHROMA_ALT[key] || GREEN_CHROMA_ALT.default;
      }

      function resolveDisplayColor(hex) {
        if (!isGreenChromaActive() || !isGreenishLedColor(hex)) return hex;
        return replaceGreenForChroma(hex);
      }

      function buildObsUrl(index) {
        var board = state.boards[index];
        if (!board) return location.href;
        var q = new URLSearchParams();
        q.set("obs", "1");
        q.set("lines", board.text || "");
        q.set("boardColors", board.rainbow ? "rainbow" : board.color);
        q.set("speed", String(state.speed));
        q.set("w", String(state.width));
        q.set("h", String(state.height));
        q.set("blink", state.blink ? "1" : "0");
        q.set("wavy", state.wavy ? "1" : "0");
        if (chromaState.enabled) {
          q.set("chroma", "1");
          q.set("chromaColor", chromaState.color);
        }
        return location.origin + location.pathname + "?" + q.toString();
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
          try {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            resolve();
          } catch (e) {
            reject(e);
          }
        });
      }

      function copyObsLink(index, btn) {
        var url = buildObsUrl(index);
        var label = "OBS 링크";
        copyText(url).then(function () {
          btn.textContent = "복사됨!";
          btn.classList.add("copied");
          setTimeout(function () {
            btn.textContent = label;
            btn.classList.remove("copied");
          }, 1600);
        }).catch(function () {
          btn.textContent = "복사 실패";
          setTimeout(function () {
            btn.textContent = label;
          }, 1600);
        });
      }

      function bindUI() {
        els.speedRange.value = state.speed;
        els.widthInput.value = state.width;
        els.heightInput.value = state.height;
        syncBlinkUi();
        syncWavyUi();
        updateSpeedLabel(state.speed);

        els.addBtn.addEventListener("click", function () {
          state.boards.push(defaultBoard());
          renderAll();
          saveState();
        });

        els.removeBtn.addEventListener("click", function () {
          if (state.boards.length <= 1) return;
          state.boards.pop();
          renderAll();
          saveState();
        });

        els.speedRange.addEventListener("input", function () {
          state.speed = +els.speedRange.value;
          updateSpeedLabel(state.speed);
          applyAllScroll();
          saveState();
        });

        els.widthInput.addEventListener("change", function () {
          state.width = clampNum(+els.widthInput.value, 200, 1920) || defaults.width;
          els.widthInput.value = state.width;
          applySize();
          applyAllScroll();
          saveState();
        });

        els.heightInput.addEventListener("change", function () {
          state.height = clampNum(+els.heightInput.value, 60, 400) || defaults.height;
          els.heightInput.value = state.height;
          applySize();
          applyEffects();
          saveState();
        });

        els.blinkToggle.addEventListener("click", function () {
          state.blink = !state.blink;
          syncBlinkUi();
          applyEffects();
          saveState();
        });

        els.wavyToggle.addEventListener("click", function () {
          state.wavy = !state.wavy;
          syncWavyUi();
          applyEffects();
          saveState();
        });

        window.addEventListener("resize", applyAllScroll);
      }

      function syncBlinkUi() {
        els.blinkToggle.classList.toggle("active", state.blink);
        els.blinkToggle.setAttribute("aria-pressed", state.blink ? "true" : "false");
        els.blinkToggle.textContent = state.blink ? "ON" : "OFF";
      }

      function syncWavyUi() {
        els.wavyToggle.classList.toggle("active", state.wavy);
        els.wavyToggle.setAttribute("aria-pressed", state.wavy ? "true" : "false");
        els.wavyToggle.textContent = state.wavy ? "ON" : "OFF";
      }

      function getWaveAmplitude() {
        return Math.max(6, Math.min(18, Math.round(state.height * 0.1))) + "px";
      }

      function applyEffects() {
        var viewports = els.stack.querySelectorAll(".led-viewport");
        var amp = getWaveAmplitude();
        for (var i = 0; i < viewports.length; i++) {
          viewports[i].classList.toggle("led-blink", state.blink);
          viewports[i].classList.toggle("led-wavy", state.wavy);
          viewports[i].style.setProperty("--wave-amp", amp);
        }
      }

      function renderAll() {
        renderDisplay();
        renderEditor();
        applySize();
        syncBlinkUi();
        syncWavyUi();
        applyEffects();
        applyAllScroll();
        if (isObs) applySize();
        els.removeBtn.disabled = state.boards.length <= 1;
      }

      function renderDisplay() {
        els.stack.innerHTML = "";
        state.boards.forEach(function (board, i) {
          var frame = document.createElement("div");
          frame.className = "led-frame";
          frame.dataset.index = String(i);
          frame.innerHTML =
            '<div class="led-viewport">' +
              '<div class="led-track centered">' +
                '<span class="led-text led-seg-a"></span>' +
                '<span class="led-text led-seg-b gap" aria-hidden="true"></span>' +
              '</div>' +
            '</div>';
          els.stack.appendChild(frame);
          fillLedSegment(frame.querySelector(".led-seg-a"), board);
          fillLedSegment(frame.querySelector(".led-seg-b"), board);
        });
      }

      function renderEditor() {
        els.editor.innerHTML = "";
        state.boards.forEach(function (board, i) {
          var row = document.createElement("div");
          row.className = "board-editor-row";
          row.dataset.index = String(i);

          var head = document.createElement("div");
          head.className = "board-editor-head";

          var num = document.createElement("span");
          num.className = "board-editor-num";
          num.textContent = (i + 1) + ".";

          var input = document.createElement("input");
          input.type = "text";
          input.placeholder = "전광판 문구";
          input.maxLength = 200;
          input.value = board.text;
          input.autocomplete = "off";
          input.addEventListener("input", function () {
            state.boards[i].text = input.value;
            updateBoardDisplay(i);
            saveState();
          });

          var obsBtn = document.createElement("button");
          obsBtn.type = "button";
          obsBtn.className = "btn btn-obs-copy";
          obsBtn.textContent = "OBS 링크";
          obsBtn.title = "이 전광판만 보이는 OBS 브라우저 소스 URL 복사";
          obsBtn.addEventListener("click", function () {
            copyObsLink(i, obsBtn);
          });

          head.appendChild(num);
          head.appendChild(input);
          head.appendChild(obsBtn);

          var presets = document.createElement("div");
          presets.className = "color-presets";

          var presetColors = [
            { c: "#c77dff", t: "보라" },
            { c: "#ff44cc", t: "핑크" },
            { c: "#4ade80", t: "초록" },
            { c: "#fbbf24", t: "노랑" },
            { c: "#60a5fa", t: "파랑" },
            { c: "#f5f5f5", t: "흰색" },
            { c: "#ff4466", t: "레드" },
            { c: "#ff8844", t: "주황" },
            { c: "#5dffc0", t: "민트" },
            { c: "#14b8a6", t: "청록" },
            { c: "#b4a7ff", t: "라벤더" },
            { c: "#6366f1", t: "인디고" },
            { c: "#ffb38a", t: "살구" },
            { c: "#ffd700", t: "골드" },
            { c: "#fda4af", t: "로즈" },
            { c: "#7dd3fc", t: "하늘" },
            { c: "#c6f135", t: "라임" },
            { c: "#e879f9", t: "마젠타" },
            { c: "#a78bfa", t: "자주" },
            { c: "#cd7f32", t: "코퍼" }
          ];

          presetColors.forEach(function (p) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "color-btn";
            btn.dataset.color = p.c;
            btn.style.background = p.c;
            btn.title = p.t;
            btn.setAttribute("aria-label", p.t);
            if (p.c === "#f5f5f5" || p.c === "#ffd700" || p.c === "#c6f135" || p.c === "#fda4af" || p.c === "#ffb38a" || p.c === "#5dffc0") {
              btn.classList.add("light-swatch");
            }
            btn.addEventListener("click", function () {
              state.boards[i].color = p.c;
              state.boards[i].rainbow = false;
              syncEditorColors(row, state.boards[i]);
              updateBoardDisplay(i);
              saveState();
            });
            presets.appendChild(btn);
          });

          var rainbowBtn = document.createElement("button");
          rainbowBtn.type = "button";
          rainbowBtn.className = "color-btn color-btn-rainbow";
          rainbowBtn.dataset.color = "rainbow";
          rainbowBtn.title = "무지개 (8색)";
          rainbowBtn.textContent = "무지개";
          rainbowBtn.addEventListener("click", function () {
            state.boards[i].rainbow = true;
            syncEditorColors(row, state.boards[i]);
            updateBoardDisplay(i);
            saveState();
          });
          presets.appendChild(rainbowBtn);

          row.appendChild(head);
          row.appendChild(presets);
          els.editor.appendChild(row);
          syncEditorColors(row, board);
        });
      }

      function syncEditorColors(row, board) {
        var btns = row.querySelectorAll(".color-btn");
        for (var j = 0; j < btns.length; j++) {
          var dc = btns[j].dataset.color;
          if (dc === "rainbow") {
            btns[j].classList.toggle("active", board.rainbow);
          } else {
            btns[j].classList.toggle("active", !board.rainbow && dc.toLowerCase() === board.color.toLowerCase());
          }
        }
      }

      function fillLedSegment(segment, board) {
        segment.innerHTML = "";
        var inner = document.createElement("span");
        inner.className = "led-text-inner";
        var chars = Array.from(board.text || "");
        var colorIdx = 0;
        chars.forEach(function (ch, charIdx) {
          var isSpace = ch === " " || ch === "\u00A0" || ch === "\t";
          var span = document.createElement("span");
          span.className = isSpace ? "led-char led-char--space" : "led-char";
          span.textContent = isSpace ? "\u00A0" : ch;
          span.style.setProperty("--wave-i", String(charIdx));
          var hex;
          if (board.rainbow) {
            hex = RAINBOW_COLORS[colorIdx % RAINBOW_COLORS.length];
            colorIdx += 1;
          } else {
            hex = board.color;
          }
          hex = resolveDisplayColor(hex);
          span.style.setProperty("--led-char-color", hex);
          span.style.setProperty("--led-char-glow", hexToGlow(hex));
          inner.appendChild(span);
        });
        segment.appendChild(inner);
      }

      function updateBoardDisplay(index) {
        var frame = els.stack.querySelector('[data-index="' + index + '"]');
        if (!frame) return;
        var board = state.boards[index];
        fillLedSegment(frame.querySelector(".led-seg-a"), board);
        fillLedSegment(frame.querySelector(".led-seg-b"), board);
        requestAnimationFrame(function () {
          applyScrollForFrame(frame);
        });
      }

      function fitObsDocumentSize(w, h) {
        var pxW = Math.ceil(w) + "px";
        var pxH = Math.ceil(h) + "px";
        document.documentElement.style.width = pxW;
        document.documentElement.style.height = pxH;
        document.body.style.width = pxW;
        document.body.style.height = pxH;
        var layout = document.querySelector(".layout");
        if (layout) {
          layout.style.width = pxW;
          layout.style.height = pxH;
        }
      }

      function applySize() {
        document.documentElement.style.setProperty("--panel-w", state.width + "px");
        document.documentElement.style.setProperty("--panel-h", state.height + "px");
        if (isObs) {
          var count = Math.max(1, state.boards.length);
          var gap = count > 1 ? (count - 1) * 20 : 0;
          fitObsDocumentSize(state.width, state.height * count + gap);
        }
      }

      function computeScrollDuration(textW) {
        var ref = state.width || 900;
        var duration = (textW / ref) * state.speed;
        return Math.max(2, Math.min(120, duration));
      }

      function applyAllScroll() {
        var frames = els.stack.querySelectorAll(".led-frame");
        frames.forEach(function (frame) {
          applyScrollForFrame(frame);
        });
      }

      function applyScrollForFrame(frame) {
        var viewport = frame.querySelector(".led-viewport");
        var track = frame.querySelector(".led-track");
        var segA = frame.querySelector(".led-seg-a");
        var segB = frame.querySelector(".led-seg-b");
        if (!viewport || !track || !segA) return;

        track.classList.remove("scrolling", "centered");
        track.style.animation = "none";
        void track.offsetWidth;

        var inner = segA.querySelector(".led-text-inner");
        var textW = inner ? inner.offsetWidth : segA.offsetWidth;
        var vpW = viewport.clientWidth;

        if (textW > vpW - 8) {
          segB.style.display = "";
          var duration = computeScrollDuration(textW);
          track.classList.add("scrolling");
          track.style.animation = "led-marquee " + duration + "s linear infinite";
        } else {
          segB.style.display = "none";
          track.classList.add("centered");
          track.style.animation = "";
        }
      }

      function updateSpeedLabel(s) {
        var label = s <= 8 ? "빠름" : s <= 20 ? "보통" : "느림";
        els.speedLabel.textContent = label + " · 가로 " + state.width + "px 기준 " + s + "초";
      }

      function loadChromaState() {
        try {
          var raw = localStorage.getItem(CHROMA_STORAGE_KEY);
          if (!raw) return;
          var saved = JSON.parse(raw);
          if (saved && typeof saved === "object") {
            chromaState.enabled = !!saved.enabled;
            if (saved.color) chromaState.color = String(saved.color);
          }
        } catch (e) { /* ignore */ }
      }

      function saveChromaState() {
        try {
          localStorage.setItem(CHROMA_STORAGE_KEY, JSON.stringify(chromaState));
        } catch (e) { /* ignore */ }
      }

      function applyChromaState() {
        document.documentElement.classList.toggle("chroma-key", chromaState.enabled);
        document.body.classList.toggle("chroma-key", chromaState.enabled);
        document.documentElement.style.setProperty("--chroma-color", chromaState.color);
      }
    })();
  </script>
</body>
</html>
